<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>57 成品老化 · 20米连续隧道</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101e;color:#e6f0ff;font-family:"Microsoft YaHei",Arial,sans-serif}canvas{display:block}
#top{position:fixed;z-index:5;left:18px;right:18px;top:14px;display:flex;gap:10px;align-items:center;pointer-events:none}.brand{font-size:21px;font-weight:800;text-shadow:0 2px 8px #000}.pill{background:#0d1d31dd;border:1px solid #284864;border-radius:8px;padding:7px 11px;font-size:13px}.pill b{color:#52e0ff}.ok{color:#48e58b}.bad{color:#ff6b70}
#help{position:fixed;z-index:5;right:18px;bottom:14px;background:#0d1d31dd;border:1px solid #284864;border-radius:8px;padding:8px 12px;font-size:12px;color:#a9bfd2;pointer-events:none}
#legend{position:fixed;z-index:5;left:18px;bottom:14px;display:flex;gap:12px;background:#0d1d31dd;border:1px solid #284864;border-radius:8px;padding:8px 12px;font-size:12px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.pass{background:#2ddf78}.ng{background:#ff414d}.empty{background:#66768c}
#tip{display:none;position:fixed;z-index:10;min-width:230px;background:#07101eef;border:1px solid #52e0ff;border-radius:8px;padding:10px;font-size:12px;pointer-events:none;line-height:1.6}
#exportBtn{position:fixed;z-index:7;right:18px;top:58px;padding:9px 15px;border:1px solid #67e8f9;border-radius:8px;background:#0e7490;color:white;font-weight:800;cursor:pointer}
</style>
<script type="importmap">{"imports":{"three":"/three.module.js"}}</script></head>
<body><div id="top"><div class="brand">57 成品老化 / AGING TUNNEL</div><div class="pill">真实位置 <b id="positions">--</b></div><div class="pill">移动载具 <b id="stands">--</b></div><div class="pill">占用通道 <b id="occupied">--</b></div><div class="pill" id="status">连接中…</div></div>
<button id="exportBtn">导出 GLB / Xuất GLB</button><div id="legend"><span><i class="dot pass"></i>PASS</span><span><i class="dot ng"></i>NG</span><span><i class="dot empty"></i>空槽/等待</span></div><div id="help">拖动旋转 · 滚轮缩放 · 点击载具查看20槽</div><div id="tip"></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from '/OrbitControls.js';import {GLTFExporter} from '/GLTFExporter.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07101e);scene.fog=new THREE.FogExp2(0x07101e,.018);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.05,120);camera.position.set(13,10,18);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(10,0.6,0);controls.enableDamping=true;controls.maxDistance=55;controls.minDistance=5;
scene.add(new THREE.HemisphereLight(0xbde7ff,0x15202c,1.7));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-6,13,10);sun.castShadow=true;scene.add(sun);
const mat=(color,metal=.1,rough=.55,transparent=false,opacity=1)=>new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough,transparent,opacity});
const box=(x,y,z,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),m);o.castShadow=o.receiveShadow=true;return o};
const floor=box(32,.08,9,mat(0x20364b,0,.85));floor.position.set(10,-.22,0);scene.add(floor);const grid=new THREE.GridHelper(32,64,0x37617e,0x183148);grid.position.set(10,-.17,0);scene.add(grid);
// Physical dimensions in metres: tunnel 20 x 2.2 x 1.8, feed/outfeed 2.5 m each.
const tunnel=new THREE.Group();scene.add(tunnel);const wall=mat(0xe8edf0,.65,.26,true,.78),frame=mat(0x496171,.85,.22),dark=mat(0x101c27,.55,.25),glass=mat(0x142d40,.5,.15,true,.48);
for(const z of [-1.1,1.1]){const side=box(20,1.8,.08,wall);side.position.set(10,.9,z);tunnel.add(side)}const roof=box(20,.08,2.2,wall);roof.position.set(10,1.8,0);tunnel.add(roof);
for(let x=0;x<=20;x+=2){for(const z of [-1.12,1.12]){const f=box(.055,1.86,.07,frame);f.position.set(x,.91,z);tunnel.add(f)}}
for(let i=0;i<7;i++){const win=box(2.15,.035,1.15,glass);win.position.set(1.6+i*2.8,1.855,0);tunnel.add(win)}
for(const x of [-1.25,21.25]){const c=box(2.5,.24,1.25,dark);c.position.set(x,.05,0);scene.add(c);for(let i=0;i<12;i++){const r=box(.035,.04,1.18,mat(0x7a94a8,.7,.3));r.position.set(x-1.1+i*.2,.19,0);scene.add(r)}}
// Visible lower return conveyor, forming the carrier circulation loop.
const ret=box(25,.12,.72,dark);ret.position.set(10,-.03,1.65);scene.add(ret);for(const x of [-2.45,22.45]){const bend=box(.75,.12,2.25,dark);bend.position.set(x,-.03,.65);scene.add(bend)}
function label(text,pos,color=0x9adfff){const c=document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');x.font='bold 38px Microsoft YaHei';x.textAlign='center';x.fillStyle='#'+color.toString(16).padStart(6,'0');x.fillText(text,256,55);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(3.5,.66,1);s.position.copy(pos);scene.add(s)}
label('上料区 · Khu Nạp Liệu',new THREE.Vector3(-1.25,2.4,0));label('20m 恒温老化区 · Khu Lão Hóa',new THREE.Vector3(10,2.55,0));label('出料区 · Khu Xuất Hàng',new THREE.Vector3(21.25,2.4,0));label('载具回流线',new THREE.Vector3(10,.5,1.75),0x70f0b0);
const stands=new Map(),ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=document.querySelector('#tip');
function makeStand(id){const g=new THREE.Group();g.rotation.y=Math.PI/2;g.userData={stand:id,slots:[]};const base=box(1.6,.22,.55,mat(0xe8eef2,.65,.24));base.position.y=.11;g.add(base);for(let i=0;i<5;i++){const rack=box(.035,.16,.48,mat(0xc82423,.55,.3));rack.position.set(-.62+i*.31,.29,0);g.add(rack)}const fan=new THREE.Group();const ring=new THREE.Mesh(new THREE.TorusGeometry(.085,.015,10,28),dark);ring.rotation.x=Math.PI/2;fan.add(ring);for(let i=0;i<4;i++){const blade=box(.065,.012,.025,mat(0x202832,.4,.3));blade.rotation.y=i*Math.PI/2;fan.add(blade)}fan.position.set(-.69,.25,0);g.add(fan);for(let i=0;i<20;i++){const a=box(.145,.05,.06,mat(0x66768c,.25,.42));a.position.set(-.71+(i%10)*.158,.31,(Math.floor(i/10)-.5)*.25);a.userData={stand:id,slot:i+1};g.add(a)}scene.add(g);stands.set(id,g);return g}
function standPosition(position,lane){const t=THREE.MathUtils.clamp((position-1)/150,0,1);return new THREE.Vector3(.18+t*19.64,.2,lane==='left'?-0.42:.42)}
function update(data){document.querySelector('#positions').textContent=data.positionCount;document.querySelector('#stands').textContent=data.standCount;document.querySelector('#occupied').textContent=data.occupiedCount;const st=document.querySelector('#status');st.textContent=data.ok?'SQL在线 '+data.updatedAt:'SQL离线 '+data.error;st.className='pill '+(data.ok?'ok':'bad');const seen=new Set();
for(const row of data.areas){for(const [lane,key] of [['left','leftStand'],['right','rightStand']]){const id=String(row[key]||'0');if(!/^\d+$/.test(id)||id==='0')continue;seen.add(id);const g=stands.get(id)||makeStand(id);g.userData.slots=data.slots[id]||[];g.userData.target=standPosition(row.position,lane);g.visible=true;const values=g.userData.slots;for(const a of g.children.filter(x=>x.userData&&x.userData.slot)){const r=String(values[a.userData.slot-1]?.result||'').toUpperCase();a.material.color.set(r==='NG'||r==='FAIL'?0xff414d:r==='PASS'||r==='OK'?0x2ddf78:0x66768c)}}} }
for(const [id,g] of stands)if(!seen.has(id))g.visible=false}
async function refresh(){try{update(await(await fetch('/api/state',{cache:'no-store'})).json())}catch(e){const st=document.querySelector('#status');st.textContent='本地服务异常 '+e;st.className='pill bad'}}setInterval(refresh,2000);refresh();
document.querySelector('#exportBtn').addEventListener('click',async()=>{const exporter=new GLTFExporter();const clone=scene.clone(true);for(const child of [...clone.children])if(child.isLight||child.isSprite)clone.remove(child);const data=await exporter.parseAsync(clone,{binary:true,onlyVisible:true});const blob=new Blob([data],{type:'model/gltf-binary'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aging_line.glb';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
renderer.domElement.addEventListener('pointermove',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects([...stands.values()],true)[0];if(!hit){tip.style.display='none';return}let g=hit.object;while(g.parent&&!g.userData.stand)g=g.parent;if(!g.userData.stand)return;const rows=g.userData.slots||[],ng=rows.filter(x=>/^(NG|FAIL)$/i.test(x.result||''));tip.innerHTML=`<b>载具 ${g.userData.stand}</b><br>20 槽 · NG ${ng.length}<br>${ng.slice(0,6).map(x=>`槽${x.slot}: ${x.sn||'无SN'} ${x.result}`).join('<br>')||'当前无NG'}`;tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-260)+'px';tip.style.top=Math.min(e.clientY+14,innerHeight-150)+'px'});
function animate(){requestAnimationFrame(animate);for(const g of stands.values())if(g.visible&&g.userData.target){g.position.lerp(g.userData.target,.06)}controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
