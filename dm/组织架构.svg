  <line x1="440" y1="230" x2="430" y2="260" class="solid-line"/>
  <line x1="440" y1="230" x2="460" y2="260" class="solid-line"/>
  <line x1="440" y1="230" x2="490" y2="260" class="solid-line"/>
  <line x1="440" y1="230" x2="520" y2="260" class="solid-line"/>
  <line x1="440" y1="230" x2="550" y2="260" class="solid-line"/>

  <rect x="390" y="260" width="30" height="180" class="org-box"/>
