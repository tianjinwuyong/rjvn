  <rect x="495" y="260" width="30" height="180" class="org-box"/>
  <text x="510" y="350" class="small-text" transform="rotate(-90, 510, 350)">PQC 1人</text>

  <rect x="530" y="260" width="30" height="180" class="org-box"/>
  <text x="545" y="350" class="small-text" transform="rotate(-90, 545, 350)">体系管理</text>

