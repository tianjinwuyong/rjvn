  <text x="280" y="218" class="small-text">负责人：黎管(中干) 钟玉勤(精干)</text>

  <!-- 工程部下属 -->
  <line x1="280" y1="230" x2="200" y2="260" class="solid-line"/>
  <line x1="280" y1="230" x2="240" y2="260" class="solid-line"/>
  <line x1="280" y1="230" x2="280" y2="260" class="solid-line"/>
  <line x1="280" y1="230" x2="320" y2="260" class="solid-line"/>
  <line x1="280" y1="230" x2="360" y2="260" class="solid-line"/>

