  <rect x="760" y="180" width="120" height="50" class="org-box"/>
  <text x="820" y="202" class="dept-text">财务部</text>
  <text x="820" y="218" class="small-text">负责人：</text>

  <!-- 财务部下属 -->
  <line x1="820" y1="230" x2="820" y2="260" class="solid-line"/>
  <rect x="800" y="260" width="40" height="180" class="org-box"/>
  <text x="820" y="350" class="small-text" transform="rotate(-90, 820, 350)">会计/出纳</text>
</svg>