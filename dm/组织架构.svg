  <rect x="235" y="500" width="40" height="80" class="org-box" fill="#cce5ff"/>
  <text x="255" y="545" class="small-text" transform="rotate(-90, 255, 545)">总部支援1人</text>

  <line x1="300" y1="440" x2="300" y2="500" class="dashed-line"/>
  <rect x="280" y="500" width="40" height="80" class="org-box" fill="#cce5ff"/>
  <text x="300" y="545" class="small-text" transform="rotate(-90, 300, 545)">总部支援1人</text>

  <line x1="345" y1="440" x2="345" y2="500" class="dashed-line"/>
  <rect x="325" y="500" width="40" height="80" class="org-box" fill="#cce5ff"/>
  <text x="345" y="545" class="small-text" transform="rotate(-90, 345, 545)">总部支援1人</text>

