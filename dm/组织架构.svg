  <rect x="580" y="180" width="120" height="50" class="org-box"/>
  <text x="640" y="202" class="dept-text">供应货部</text>
  <text x="640" y="218" class="small-text">负责人：Tina(越南)</text>

  <!-- 供应货部下属 -->
  <line x1="640" y1="230" x2="610" y2="260" class="solid-line"/>
  <line x1="640" y1="230" x2="650" y2="260" class="solid-line"/>
  <line x1="640" y1="230" x2="690" y2="260" class="solid-line"/>

  <rect x="600" y="260" width="30" height="180" class="org-box"/>
  <text x="615" y="350" class="small-text" transform="rotate(-90, 615, 350)">PC/MC 1人</text>

  <rect x="640" y="260" width="30" height="180" class="org-box"/>
