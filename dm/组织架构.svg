<svg width="1000" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .org-box { fill: #ffffff; stroke: #333333; stroke-width: 1; }
      .solid-line { stroke: #333333; stroke-width: 1.5; }
      .dashed-line { stroke: #333333; stroke-width: 1.5; stroke-dasharray: 4 2; }
      .dept-text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .small-text { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
    </style>
  </defs>

  <!-- 公司总负责人 -->
  <rect x="420" y="30" width="120" height="50" class="org-box"/>
  <text x="480" y="52" class="dept-text">公司总负责人</text>
  <text x="480" y="68" class="small-text">深圳：张先生</text>

  <!-- 连线到华南工厂 -->
  <line x1="480" y1="80" x2="480" y2="100" class="solid-line"/>

  <!-- 华南工厂 -->
  <rect x="420" y="100" width="120" height="50" class="org-box"/>
  <text x="480" y="122" class="dept-text">华南工厂</text>
  <text x="480" y="138" class="small-text">总负责人：赵明军</text>

  <!-- 主分支连接线 -->
  <line x1="480" y1="150" x2="120" y2="180" class="solid-line"/>
  <line x1="480" y1="150" x2="280" y2="180" class="solid-line"/>
  <line x1="480" y1="150" x2="440" y2="180" class="solid-line"/>
  <line x1="480" y1="150" x2="640" y2="180" class="solid-line"/>
  <line x1="480" y1="150" x2="800" y2="180" class="solid-line"/>

  <!-- 生产部 -->
  <rect x="60" y="180" width="120" height="50" class="org-box"/>
  <text x="120" y="202" class="dept-text">生产部</text>
  <text x="120" y="218" class="small-text">负责人：***(精干)</text>

  <!-- 生产部下属 -->
  <line x1="120" y1="230" x2="60" y2="260" class="solid-line"/>
  <line x1="120" y1="230" x2="100" y2="260" class="solid-line"/>
  <line x1="120" y1="230" x2="140" y2="260" class="solid-line"/>

  <rect x="40" y="260" width="40" height="180" class="org-box"/>
