const NCOL = DATA.ncol, NROW = DATA.nrow;
const ZONES = DATA.zones, ZCN = DATA.zone_cn, COLORS = DATA.colors;
const cell = new Map();            // "c,r" -> zone index (manual override)
DATA.cells.forEach(([c,r,z])=>cell.set(c+","+r,{auto:z, manual:null}));
const CW = 16;                     // px per cell
const W = NCOL*CW, H = NROW*CW;
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
let selZone = 0;

function draw(){
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
  // equipment outlines
  ctx.strokeStyle = '#c8c8c8'; ctx.lineWidth = 0.6;
  DATA.equip.forEach(([x0,y0,x1,y1])=>{
    ctx.strokeRect(x0*CW, (NROW-y1)*CW, (x1-x0)*CW, (y1-y0)*CW);
  });
  // cells
  for(let c=0;c<NCOL;c++) for(let r=0;r<NROW;r++){
    const z = cell.get(c+","+r);
    const zi = z.manual!==null ? z.manual : z.auto;
    ctx.fillStyle = COLORS[zi]; ctx.globalAlpha = z.manual!==null ? 0.85 : 0.30;
    ctx.fillRect(c*CW, (NROW-1-r)*CW, CW, CW);
  }
  ctx.globalAlpha = 1;
  // grid lines
  ctx.strokeStyle = '#999'; ctx.lineWidth = 0.4;
  ctx.beginPath();
  for(let c=0;c<=NCOL;c++){ if(c%5===0) continue; ctx.moveTo(c*CW,0); ctx.lineTo(c*CW,H); }
  for(let r=0;r<=NROW;r++){ if(r%5===0) continue; ctx.moveTo(0,r*CW); ctx.lineTo(W,r*CW); }
  ctx.stroke();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 0.8;
  ctx.beginPath();
  for(let c=0;c<=NCOL;c+=5){ ctx.moveTo(c*CW,0); ctx.lineTo(c*CW,H); }
  for(let r=0;r<=NROW;r+=5){ ctx.moveTo(0,r*CW); ctx.lineTo(W,r*CW); }
  ctx.stroke();
  // axis labels
  ctx.fillStyle = '#333'; ctx.font = '10px sans-serif';
  for(let c=0;c<=NCOL;c+=10){ ctx.fillText('X'+c, c*CW+2, H-2); }
  for(let r=0;r<=NROW;r+=10){ ctx.fillText('Y'+r, 2, H-(r*CW)+2); }
  // labels
  ctx.fillStyle = '#222'; ctx.font = '9px "Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  DATA.labels.forEach(([x,y,t])=>{
    const px = x*CW, py = (NROW-y)*CW;
    if(px<0||px>W||py<0||py>H) return;
    ctx.globalAlpha = 0.9; ctx.fillText(t, px, py);
  });
  ctx.globalAlpha = 1;
}
function zoneListBuild(){
  const el = document.getElementById('zoneList');
  const total = {};
  DATA.cells.forEach(([c,r,z])=>{ total[z]=(total[z]||0)+1; });
  ZONES.forEach((z,i)=>{
    const d = document.createElement('div');
    d.className = 'zoneRow'+(i===selZone?' sel':'');
    d.innerHTML = `<span class="swatch" style="background:${COLORS[i]}"></span>${ZCN[i]}<span class="count">${total[i]||0}</span>`;
    d.onclick = ()=>{ selZone = i; document.querySelectorAll('.zoneRow').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); };
    el.appendChild(d);
  });
}
cv.addEventListener('mousemove', e=>{
  const rect = cv.getBoundingClientRect();
  const sx = (e.clientX-rect.left)*(W/rect.width), sy = (e.clientY-rect.top)*(H/rect.height);
  const c = Math.floor(sx/CW), r = NROW-1-Math.floor(sy/CW);
  if(c<0||c>=NCOL||r<0||r>=NROW){ document.getElementById('curCell').textContent='—'; return; }
  const z = cell.get(c+","+r);
  const zi = z.manual!==null ? z.manual : z.auto;
  document.getElementById('curCell').textContent = `X${String(c+1).padStart(2,'0')}-Y${String(r+1).padStart(2,'0')}`;
  document.getElementById('curAuto').textContent = ZCN[z.auto];
  const info = document.getElementById('cellInfo');
  info.innerHTML = `<b>自动分区:</b> ${ZCN[z.auto]}<br><b>当前分配:</b> ${z.manual!==null?ZCN[z.manual]:'（未手动分配）'}<br><b>坐标:</b> x=${c}.00–${c+1}.00 m, y=${r}.00–${r+1}.00 m`;
});
cv.addEventListener('click', e=>{
  const rect = cv.getBoundingClientRect();
  const sx = (e.clientX-rect.left)*(W/rect.width), sy = (e.clientY-rect.top)*(H/rect.height);
  const c = Math.floor(sx/CW), r = NROW-1-Math.floor(sy/CW);
  if(c<0||c>=NCOL||r<0||r>=NROW) return;
  const z = cell.get(c+","+r);
  z.manual = (z.manual===selZone) ? null : selZone;   // toggle
  draw();
});
function clearManual(){ cell.forEach(z=>z.manual=null); draw(); }
function resetAll(){ clearManual(); }
function exportJSON(){
  const out = {meta:{ncol:NCOL,nrow:NROW,cell_m:1,zones:ZCN}, assignments:[]};
  cell.forEach((z,key)=>{
    if(z.manual!==null){ const [c,r]=key.split(',').map(Number); out.assignments.push({cell:`X${String(c+1).padStart(2,'0')}-Y${String(r+1).padStart(2,'0')}`,zone:ZCN[z.manual]}); }
  });
  download('plant_grid_allocated.json', JSON.stringify(out,null,1));
}
function exportCSV(){
  let s = 'cell_id,zone_auto,zone_manual,x_m,y_m\n';
  cell.forEach((z,key)=>{
    const [c,r]=key.split(',').map(Number);
    s += `X${String(c+1).padStart(2,'0')}-Y${String(r+1).padStart(2,'0')},${ZCN[z.auto]},${z.manual!==null?ZCN[z.manual]:''},${c}.00,${r}.00\n`;
  });
  download('plant_grid_allocated.csv', s);
}
function importJSON(ev){
  const f = ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ try{
    const j = JSON.parse(rd.result);
    clearManual();
    (j.assignments||[]).forEach(a=>{
      const m = /X(\d+)-Y(\d+)/.exec(a.cell); if(!m) return;
      const c = +m[1]-1, r = +m[2]-1, zi = ZCN.indexOf(a.zone);
      if(c>=0&&c<NCOL&&r>=0&&r<NROW&&zi>=0) cell.get(c+","+r).manual = zi;
    });
    draw();
  }catch(err){ alert('导入失败: '+err.message); } };
  rd.readAsText(f);
}
function download(name, content){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));
  a.download = name; a.click();
}
zoneListBuild(); draw();
