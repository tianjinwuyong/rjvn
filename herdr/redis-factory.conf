# RuiJing Vietnam factory - Redis instance for the agent message bus.
#
# IMPORTANT: redis-server.exe here is a Cygwin/MSYS build (bundled with
# HomeNas). It only understands POSIX paths. A Windows path like
# C:\Users\... makes it abort with:
#   Fatal error, can't open config file '/cygdrive/c/Users/...'
# so every path below is written as /cygdrive/c/...
#
# Start it:
#   & "C:\Program Files (x86)\HomeNas\2026.8.6.2171\redis\redis-server.exe" \
#       "/cygdrive/c/Users/tianj/Desktop/越南工厂瑞晶/herdr/redis-factory.conf"
#
# Note: there is no redis-cli.exe in that folder. Use
#   python ..\agents\mailbox\rjcli.py status
# instead.

bind 127.0.0.1
port 6379

# The MSYS build cannot raise maxclients past the Windows fd limit; 1024 is
# well within the 3200 handles it actually gets.
maxclients 1024

# Message bus data lives with the project so it travels with the repo.
dir /cygdrive/c/Users/tianj/Desktop/越南工厂瑞晶/mailbox
dbfilename rjvn-mailbox.rdb
appendonly no
save 900 1
save 300 10
save 60 10000

daemonize no
logfile /cygdrive/c/Users/tianj/Desktop/越南工厂瑞晶/mailbox/redis.log
loglevel notice

# The mailbox is local to the dev box; the factory deployment points this
# at the factory Redis and sets requirepass.
# requirepass change_me

timeout 0
tcp-keepalive 300
